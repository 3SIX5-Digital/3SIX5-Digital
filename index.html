<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Slider - Large Active Slide</title>
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="swiper-container mySwiper">
        <div class="swiper-wrapper">
            <!-- Slides will be dynamically sized by CSS/JS -->
            <div class="swiper-slide">Slide 1 Content</div>
            <div class="swiper-slide">Slide 2 Content</div>
            <div class="swiper-slide">Slide 3 Content</div>
            <div class="swiper-slide">Slide 4 Content</div>
            <div class="swiper-slide">Slide 5 Content</div>
            <div class="swiper-slide">Slide 6 Content</div>
        </div>
        <!-- Add Pagination -->
        <div class="swiper-pagination"></div>

        <!-- Add Navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>

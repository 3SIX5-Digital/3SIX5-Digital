    <title>GSAP Scroll Animation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            /* Make body long enough to scroll */
            height: 200vh;
        }

        .main-container {
            /* This container will be the main trigger for ScrollTrigger */
            /* It needs a defined height if we pin it or if animations are based on its dimensions */
            /* For now, let's make it occupy the viewport height */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Align items to the start (top) of the flex container */
            text-align: center;
            padding-top: 10vh; /* Give some space from the top for the heading */
            box-sizing: border-box; /* Include padding in height calculation */
        }

        h1 {
            font-size: clamp(1.5em, 5vw, 3em); /* Responsive font size */
            margin-bottom: 5vh; /* Space between heading and SVG area */
        }

        .svg-container {
            width: 80%;
            max-width: 600px; /* Max width for the SVG */
            /* The SVG itself will be centered by the parent's flex properties */
        }

        /* Styles for SVG elements if needed for animation setup (e.g., initial opacity) */
        /* GSAP will handle most of the dynamic styling for animation */
        .svg-container svg {
            /* Ensure SVG scales nicely */
            width: 100%;
            height: auto;
            overflow: visible; /* Important for stroke animations if paths go to the edge */
        }

    </style>
</head>

            // Button text will now just fade in, no initDraw needed for it.

            // Set initial states
            // Elements for fade-in/scale-in, or draw-in that should start invisible
            gsap.set([
                logoBrandGroup,
                menuIconBlock,
                customisableTextGroup,
                pictureImageShape,
                pictureSun,
                buttonText,
                buttonBase // <--- Added buttonBase here
            ], { autoAlpha: 0, scale: 0.9, transformOrigin: "center center" });

            // For elements that scale but might not need autoAlpha 0 from the group above (if part of a draw)
            // We can refine this if needed, but the above set should make buttonBase start invisible.
            // Scale for buttonBase and buttonText will be handled by their timeline tweens if needed,
            // or they'll just use scale:1 if not specified. The group set primarily gives them autoAlpha:0.
            // The buttonBase is drawn, so its scale should be 1. We can override its scale from the group set.
            gsap.set(buttonBase, { scale: 1 }); // Override scale set by the group if it was included

            gsap.set(customisableTextGroup.querySelectorAll('path'), {autoAlpha: 0}); // individual paths in text

            // Specifically for pictureBlockOutline, set its fill-opacity to 0 initially
            gsap.set(pictureBlockOutline, { fillOpacity: 0 });
            // Also ensure pictureBlockOutline starts invisible if it's drawn, then its fill fades.
            // If its stroke is drawn, the element itself needs to be visible (autoAlpha:1) for the stroke to be seen,
            // but its content (fill) is hidden by fillOpacity:0.
            // The initDraw function handles the stroke to look empty.
            // So, pictureBlockOutline should NOT be in the autoAlpha:0 group above if its stroke is drawn first.

            // Let's refine initial states:
            // Fade-in elements (start at autoAlpha 0, scale 0.9)
            gsap.set([logoBrandGroup, menuIconBlock, customisableTextGroup, pictureImageShape, pictureSun, buttonText], { autoAlpha: 0, scale: 0.9, transformOrigin: "center center" });
            // Drawn elements that should also start invisible until their draw sequence begins
            gsap.set([buttonBase], {autoAlpha:0}); // Explicitly hide buttonBase initially

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: '#animation-section',
                    start: 'top top',
                    end: `+=${window.innerHeight * 0.75}`,
                    scrub: 1,
                    pin: true,
                    markers: true,
                }
            });

            // Animation sequence
            tl
                .to(outsideWireframe, { strokeDashoffset: 0, duration: 2 })
                .to(navBlock, { strokeDashoffset: 0, duration: 1.5 }, "-=1.5")
                .to(dottedLine, { strokeDashoffset: 0, duration: 2, ease: "power1.inOut" }, "-=1.0")

                .to(logoBrandGroup, { autoAlpha: 1, scale: 1, duration: 1 }, "-=1.0")
                .to(menuIconBlock, { autoAlpha: 1, scale: 1, duration: 0.5 }, "<0.2")

                .to(customisableTextGroup, { autoAlpha: 1, scale: 1, duration: 0.1 })
                .to(customisableTextGroup.querySelectorAll('path'), { autoAlpha: 1, stagger: 0.1, duration: 0.5 }, "<")

                .to(paragraphLine1, { strokeDashoffset: 0, duration: 1 }, "-=0.5")
                .to(paragraphLine2, { strokeDashoffset: 0, duration: 1 }, "-=0.8")
                .to(paragraphLine3, { strokeDashoffset: 0, duration: 1 }, "-=0.8")

                // Picture Block animation
                .to(pictureBlockOutline, { strokeDashoffset: 0, duration: 1.5 }, "-=0.5")
                .to(pictureBlockOutline, { fillOpacity: 1, duration: 0.7 }, "<0.8") // Fade in fill after stroke starts drawing
                .to(pictureImageShape, { autoAlpha: 1, scale: 1, duration: 1 }, "<0.2") // Slightly after fill starts
                .to(pictureSun, { autoAlpha: 1, scale: 1, duration: 0.7 }, "<0.3")

                // Button animation
                // Ensure buttonBase is visible for its stroke animation
                .set(buttonBase, { autoAlpha: 1 }, "-=0.2") // Ensure it's visible slightly before its animation starts
                .to(buttonBase, { strokeDashoffset: 0, duration: 1.2 }, "<") // Draws the button border, ensure it starts when set
                .to(buttonText, { autoAlpha: 1, scale: 1, duration: 0.7 }, "<0.5"); // Text fades in, 0.5s after button border starts

            // Ensure drawn elements are visible for stroke animation.
            // The gsap.set for buttonBase above is a specific fix.
            // General logic for other drawn elements:
            // For elements that are drawn, their stroke is animated, but the element itself should be visible.
            // For elements that only fade/scale, their autoAlpha is animated from 0.
            // The initial gsap.set calls handle the starting autoAlpha states.
            // We need to ensure that elements being 'drawn' are not set to autoAlpha 0 by a broad selector.
            let elementsToDraw = [outsideWireframe, navBlock, dottedLine, paragraphLine1, paragraphLine2, paragraphLine3, pictureBlockOutline, buttonBase];
            elementsToDraw.forEach(el => {
                if (el) {
                    // If it was part of the general autoAlpha:0 set, override for draw elements
                    if (el !== logoBrandGroup && el !== menuIconBlock && el !== customisableTextGroup && el !== pictureImageShape && el !== pictureSun && el !== buttonText) {
                         gsap.set(el, {autoAlpha: 1}); // Make sure it's visible for drawing
                    }
                }
            });
        });
    </script>

</body>
